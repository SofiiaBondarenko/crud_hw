<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Students</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Список студентів</h1>
      <button id="get-students-btn">Отримати студентів</button>
      <table id="students-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Ім'я</th>
            <th>Вік</th>
            <th>Курс</th>
            <th>Навички</th>
            <th>Email</th>
            <th>Статус</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody>
          <!-- Динамічно заповнено -->
        </tbody>
      </table>
      <button id="addStudent-btn">Додати студента</button>
    </div>
    <div class="backdrop">
      <div class="modal">
        <form class="modal-form">
          <h2>Додати нового студента</h2>
          <input  name="id" type="text" placeholder="введіть id" class="input"/>
          <input name="name" type="text" placeholder="введіть ім'я" class="input"/>
          <input name="age" type="text" placeholder="введіть вік" class="input"/>
          <input name="course" type="text" placeholder="введіть курс" class="input"/>
          <input name="skills" type="text" placeholder="введіть навички" class="input"/>
          <input name="email" type="email" placeholder="введіть email" class="input"/>

          <label >Зарахований?<input name="isEnrolled" type="checkbox"/></label>
          <button class="submit" type="submit">Create</button>
        </form>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
